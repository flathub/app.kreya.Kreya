app-id: app.kreya.Kreya
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: kreya
copy-icon: true
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: kreya
    buildsystem: simple
    build-commands:
      - cp -a kreya/* /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://stable-downloads.kreya.app/1.21.0/Kreya-app-linux-x64.tar.gz
        sha256: 93d665c50a3cd77bf5d7edc4b6a25d4571dcfd783692d86f5b5e1a9dcebacfdf
        dest: kreya
        x-checker-data:
          type: html
          url: https://stable-downloads.kreya.app/latest/version.txt
          version-pattern: ([\d]+\.[\d]+\.[\d]+)
          url-template: https://stable-downloads.kreya.app/$version/Kreya-app-linux-x64.tar.gz
          is-main-source: true
      - type: archive
        only-arches:
          - aarch64
        url: https://stable-downloads.kreya.app/1.21.0/Kreya-app-linux-arm64.tar.gz
        sha256: 7b809b034a35c61f90aba285bd7e4f2bf300d4e913c42e23568351fb615a7b93
        dest: kreya
        x-checker-data:
          type: html
          url: https://stable-downloads.kreya.app/latest/version.txt
          version-pattern: ([\d]+\.[\d]+\.[\d]+)
          url-template: https://stable-downloads.kreya.app/$version/Kreya-app-linux-arm64.tar.gz
