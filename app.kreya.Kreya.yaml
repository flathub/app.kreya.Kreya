app-id: app.kreya.Kreya
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: kreya
copy-icon: true
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
modules:
  - name: kreya
    buildsystem: simple
    build-commands:
      - cp -a kreya/* /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://stable-downloads.kreya.app/1.20.3/Kreya-app-linux-x64.tar.gz
        sha256: 0976ad2f8402e7068f556743a22dd5f9d7f2c78f0d2bb6f8dfd0116cbae962a2
        dest: kreya
        x-checker-data:
          type: html
          url: https://stable-downloads.kreya.app/latest/version.txt
          version-pattern: ([\d]+\.[\d]+\.[\d]+)
          url-template: https://stable-downloads.kreya.app/$version/Kreya-app-linux-x64.tar.gz
          is-main-source: true
      - type: archive
        only-arches:
          - aarch64
        url: https://stable-downloads.kreya.app/1.20.3/Kreya-app-linux-arm64.tar.gz
        sha256: f4323819def307ce4584b92f2c683c95f05aff49481c0172bce70e026ecb9aec
        dest: kreya
        x-checker-data:
          type: html
          url: https://stable-downloads.kreya.app/latest/version.txt
          version-pattern: ([\d]+\.[\d]+\.[\d]+)
          url-template: https://stable-downloads.kreya.app/$version/Kreya-app-linux-arm64.tar.gz
