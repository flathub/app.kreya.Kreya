app-id: app.kreya.Kreya
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: kreya
copy-icon: true
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: kreya
    buildsystem: simple
    build-commands:
      - cp -a kreya/* /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://stable-downloads.kreya.app/1.22.0/Kreya-app-linux-x64.tar.gz
        sha256: 61dd3070a0ec25a5f12f80952399b6c42c6dddcfb48a9de2aa2730e5e6a7dc44
        dest: kreya
        x-checker-data:
          type: html
          url: https://stable-downloads.kreya.app/latest/version.txt
          version-pattern: ([\d]+\.[\d]+\.[\d]+)
          url-template: https://stable-downloads.kreya.app/$version/Kreya-app-linux-x64.tar.gz
          is-main-source: true
      - type: archive
        only-arches:
          - aarch64
        url: https://stable-downloads.kreya.app/1.22.0/Kreya-app-linux-arm64.tar.gz
        sha256: 475c6ca857753716cc9824c55ce7e5af252a630137e2ce2b4cf342751f65cce4
        dest: kreya
        x-checker-data:
          type: html
          url: https://stable-downloads.kreya.app/latest/version.txt
          version-pattern: ([\d]+\.[\d]+\.[\d]+)
          url-template: https://stable-downloads.kreya.app/$version/Kreya-app-linux-arm64.tar.gz
